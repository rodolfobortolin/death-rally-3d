<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Death Rally 3D</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div class="hud-panel hud-top-left">
        <div class="hud-label">LAP TIME</div>
        <div id="hud-lap" class="hud-value">0:00.000</div>
        <div class="hud-label">BEST</div>
        <div id="hud-best" class="hud-value small">--</div>
      </div>
      <div class="hud-panel hud-bottom-right">
        <div id="hud-speed" class="hud-speed">0</div>
        <div class="hud-label">KM/H</div>
      </div>
      <div class="hud-help">
        WASD / Arrows: drive &nbsp;·&nbsp; Space: handbrake &nbsp;·&nbsp; R: reset car &nbsp;·&nbsp; C: camera mode
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
